# Release: bump the version, commit, tag, push.
#
# The tag push triggers ci.yaml, which builds and publishes the image and chart
# to GHCR and only then creates the GitHub release. Nothing in this workflow
# publishes artifacts, so a failed build can no longer leave a release page
# with no image behind it.
#
# That tag push needs a PAT: a tag pushed with GITHUB_TOKEN does not trigger
# workflows. Required secret:
#   REPO_PAT: a PAT (or GitHub App token) with write access to this repository.
#
# Re-running this workflow is safe: an existing tag is left alone, and a version
# already in the tree is tagged without an empty commit.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version bump applied to the current chart version"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Explicit version (e.g. 0.41.0). Overrides the bump above."
        required: false
        type: string
      branch:
        description: "Branch to release from"
        required: false
        default: main
        type: string

permissions:
  contents: write

# Never run two releases at once; a half-finished bump would race on the tag.
concurrency:
  group: release-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag and push
    runs-on: ubuntu-latest
    env:
      BUMP: ${{ inputs.bump }}
      EXPLICIT: ${{ inputs.version }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          next=$(python3 hack/release/version.py next --bump "$BUMP" --explicit "$EXPLICIT")
          echo "next: $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Bump Chart.yaml and package.json
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          python3 hack/release/version.py apply --version "$NEXT"
          git --no-pager diff --stat

      - name: Commit, tag and push
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "v$NEXT" > /dev/null 2>&1; then
            echo "v$NEXT is already tagged; nothing to do"
            exit 0
          fi

          # The version files can already carry NEXT -- that is what happens when
          # a release is cut from a branch where the version was set by hand, or
          # when this workflow is re-run after a failed publish. Tagging the
          # current commit is then the whole job; exiting here with an error used
          # to dead-end the release with "nothing to release".
          # Scoped to the files this step commits: an unrelated dirty file in
          # the checkout must not send us down the commit path, where an empty
          # `git commit` aborts the job under `bash -e`.
          if git diff --quiet -- charts/weave-gitops/Chart.yaml package.json; then
            echo "version files already at $NEXT, tagging the current commit"
          else
            git add charts/weave-gitops/Chart.yaml package.json
            git commit -m "chore(release): v$NEXT"
            git push origin "HEAD:$BRANCH"
          fi

          git tag "v$NEXT"
          git push origin "v$NEXT"
