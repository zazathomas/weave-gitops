# Release: bump the version, commit, tag, push and create a GitHub release.
#
# The tag push triggers ci.yaml, which builds and publishes the image and chart to GHCR.
# That needs a PAT: a tag pushed with GITHUB_TOKEN does not trigger workflows.
#
# Required secret:
#   REPO_PAT: a PAT (or GitHub App token) with write access to this repository.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version bump applied to the current chart version"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Explicit version (e.g. 0.41.0). Overrides the bump above."
        required: false
        type: string
      branch:
        description: "Branch to release from"
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Bump, tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 0

      - name: Work out the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          current=$(python3 -c "
          import re, sys
          print(re.search(r'^version:\s*(\S+)$', open('charts/weave-gitops/Chart.yaml').read(), re.M).group(1))
          ")
          echo "current: $current"

          next=$(python3 - "$current" "$BUMP" "$EXPLICIT" <<'EOF'
          import re, sys
          current, bump, explicit = sys.argv[1], sys.argv[2], sys.argv[3].strip()
          if explicit:
              print(explicit.lstrip("v"))
              sys.exit(0)
          m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:-.*)?", current)
          if not m:
              sys.exit(f"cannot bump non-semver version {current!r}")
          major, minor, patch = (int(g) for g in m.groups())
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          print(f"{major}.{minor}.{patch}")
          EOF
          )
          echo "next: $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Bump Chart.yaml and package.json
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          python3 - <<'EOF'
          import json, os, re

          version = os.environ["NEXT"]

          chart_path = "charts/weave-gitops/Chart.yaml"
          chart = open(chart_path).read()
          chart = re.sub(r"^version: .*$", f"version: {version}", chart, count=1, flags=re.M)
          chart = re.sub(r'^appVersion: .*$', f'appVersion: "v{version}"', chart, count=1, flags=re.M)
          open(chart_path, "w").write(chart)

          pkg_path = "package.json"
          pkg = json.load(open(pkg_path))
          pkg["version"] = version
          open(pkg_path, "w").write(json.dumps(pkg, indent=2) + "\n")
          EOF
          git --no-pager diff --stat

      - name: Commit, tag and push
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          if git diff --quiet; then
            echo "nothing to release, the version is already $NEXT"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/weave-gitops/Chart.yaml package.json
          git commit -m "chore(release): v$NEXT"
          git tag "v$NEXT"
          git push origin "HEAD:${{ inputs.branch }}"
          git push origin "v$NEXT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: gh release create "v$NEXT" --generate-notes --title "v$NEXT"
