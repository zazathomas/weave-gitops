# CI: lint, test, build. On a v* tag it also publishes the image and chart to GHCR.
#
#   PR / push to main : proto, UI, Go, chart, versions, image build (no push)
#   push of v* tag    : the above, plus multi-arch image push (SBOM, provenance, cosign),
#                       Helm chart push to oci://ghcr.io/<repo>/charts (cosign),
#                       a smoke test of the published artifacts, and the GitHub
#                       release itself. Publishing waits on the test jobs, so a
#                       failing test suite cannot produce a release.
#   workflow_dispatch : same as a branch, with `publish` to run the publish path manually
#
# Rebuild an existing release without moving its tag:
#
#   gh workflow run ci.yaml --ref v0.40.0
#
# That re-runs the publish path against the tag, so the OIDC identity stays
# "ci.yaml@refs/tags/v0.40.0" and the signatures still verify for consumers.
# Moving a tag instead leaves the GitHub release orphaned and re-drafted.
#
# Tag pushes must be created with a PAT (see release.yaml), because a tag pushed with
# GITHUB_TOKEN does not trigger workflows.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the image and chart for this ref"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/gitops-server
  CHART: ghcr.io/${{ github.repository }}/charts/weave-gitops
  CHART_DIR: charts/weave-gitops
  FLUX_VERSION: "2.9.6"

jobs:
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # shellcheck is preinstalled on the runner, so actionlint checks the run:
      # blocks too. This is what catches quoting and $GITHUB_ENV format mistakes
      # before a release run discovers them 25 minutes in.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" -color

  versions:
    name: Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test the release tooling
        run: python3 -m unittest discover -s hack/release -p 'test_*.py' -v

      # Fails fast when Chart.yaml, appVersion, package.json and the tag
      # disagree, instead of letting the release job report "nothing to
      # release" after the fact.
      - name: Check the version files agree
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 hack/release/version.py check --tag "$TAG"

  proto:
    name: Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate and check for drift
        run: |
          make proto
          git diff --no-ext-diff --exit-code

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: |
          corepack enable
          make node_modules

      - name: Lint and typecheck
        run: make ui-lint

      - name: Audit production dependencies
        run: make ui-audit

      - name: Test
        run: make ui-test

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: make check-format

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The suite shells out to the flux CLI; keep it in step with the Makefile.
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39
        with:
          version: ${{ env.FLUX_VERSION }}

      - name: Unit tests (envtest)
        run: make unit-tests

      - name: Build the server
        run: make gitops-server

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Lint
        run: make helm-lint

      - name: Render with defaults
        run: make helm-template

      - name: Render with every optional feature on
        run: |
          # shellcheck disable=SC2016 # the bcrypt hash must stay literal
          helm template weave-gitops "$CHART_DIR" \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0].host=gitops.example.com' \
            --set 'ingress.hosts[0].paths[0].path=/' \
            --set 'ingress.hosts[0].paths[0].pathType=Prefix' \
            --set metrics.enabled=true \
            --set serverTLS.enable=true \
            --set adminUser.create=true \
            --set 'adminUser.passwordHash=$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy' \
            --set oidcSecret.create=true \
            --set oidcSecret.clientID=gitops-client \
            --set oidcSecret.clientSecret=gitops-secret \
            --set oidcSecret.issuerURL=https://issuer.example.com \
            --set oidcSecret.redirectURL=https://gitops.example.com/oauth2/callback \
            --set replicaCount=2 > /dev/null

      - name: Package
        run: make chart-package

  image:
    name: Image
    # Publishing must not outrun the test suite: without these needs a tag build
    # would push (and move :latest) even when the Go tests fail.
    needs: [proto, ui, go-lint, go-test, versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Multi-line values must use the KEY<<DELIM form: a bare second line in
      # $GITHUB_ENV makes the runner reject the whole file ("Invalid format"),
      # which silently drops PUBLISH/TAGS/LDFLAGS and skips every publish step.
      - name: Set build env
        env:
          # Expressions in `run:` are substituted before bash sees them, so keep
          # them in env instead; shellcheck reads the leftovers literally.
          DISPATCH_PUBLISH: ${{ inputs.publish || 'false' }}
        run: |
          version=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "PUBLISH=true" >> "$GITHUB_ENV"
            {
              echo 'TAGS<<EOF'
              echo "$IMAGE:${GITHUB_REF#refs/tags/}"
              # A prerelease must not take over :latest -- v0.39.1-rc.1 would
              # otherwise repoint the tag that "install the latest" follows.
              if [[ "${GITHUB_REF#refs/tags/}" != *-* ]]; then
                echo "$IMAGE:latest"
              fi
              echo 'EOF'
            } >> "$GITHUB_ENV"
            version="${GITHUB_REF#refs/tags/}"
          else
            echo "PUBLISH=$DISPATCH_PUBLISH" >> "$GITHUB_ENV"
            echo "TAGS=$IMAGE:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          # A tag checkout is a shallow, single-ref fetch, so the Makefile's
          # `git describe --match "v*"` finds no tags and falls back to the
          # commit sha. Pass the tag through so the binary reports its release
          # instead of 4f0ec01.
          {
            echo 'LDFLAGS<<EOF'
            if [[ -n "$version" ]]; then
              make -s echo-ldflags VERSION="$version"
            else
              make -s echo-ldflags
            fi
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A branch or PR only proves the Dockerfile still builds; the push, SBOM,
      # provenance and signing only happen for a release.
      - name: Build
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: gitops-server.dockerfile
          build-args: |
            LDFLAGS=${{ env.LDFLAGS }}
            GIT_COMMIT=${{ github.sha }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push
        id: build
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: gitops-server.dockerfile
          build-args: |
            LDFLAGS=${{ env.LDFLAGS }}
            GIT_COMMIT=${{ github.sha }}
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3
        if: env.PUBLISH == 'true'

      # The Makefile derives VERSION from `git describe`, which needs the tag.
      # A tag checkout is shallow, so a release would silently label itself with
      # the commit sha (as v0.40.0 did before it was rebuilt).
      - name: Check the binary was stamped with the release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          case "$LDFLAGS" in
            *"core/server.Version=v${GITHUB_REF#refs/tags/v}"*) echo "stamped with v${GITHUB_REF#refs/tags/v}" ;;
            *) echo "LDFLAGS do not stamp the tag version: $LDFLAGS"; exit 1 ;;
          esac

      - name: Sign
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Verify the signature
        if: env.PUBLISH == 'true'
        run: |
          cosign verify "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  chart-publish:
    name: Chart publish
    # Waiting on the image keeps the chart from being installable before the
    # image it points at exists (upstream called this "release locking").
    needs: [chart, image]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      # A docker-style login writes ~/.docker/config.json, which helm push and
      # cosign sign both read. The helm registry login it replaces only wrote
      # ~/.config/helm/registry/config.json, which cosign ignores, so the
      # signature push failed with "UNAUTHORIZED: unauthenticated" after a
      # successful chart push.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        run: |
          helm package "$CHART_DIR" -d dist
          helm push dist/weave-gitops-*.tgz "oci://${{ env.REGISTRY }}/${{ github.repository }}/charts" \
            2>&1 | tee push.log
          digest=$(awk '/Digest: /{print $2}' push.log)
          [ -n "$digest" ] || { echo "could not read the digest from helm push"; cat push.log; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: Sign
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ github.repository }}/charts/weave-gitops@${{ steps.push.outputs.digest }}"

      - name: Verify the signature
        run: |
          cosign verify \
            "${{ env.REGISTRY }}/${{ github.repository }}/charts/weave-gitops@${{ steps.push.outputs.digest }}" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  # Publishes happen without anyone looking at the result: the tag build is
  # green as soon as the push succeeds. These checks read the artifacts back out
  # of the registry, which is how a release ends up labelled with the wrong
  # version or signed with a signature nobody can verify.
  verify-release:
    name: Verify release
    needs: [image, chart-publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # Pulling anonymously works only while the packages are public. Logging in
      # makes the check independent of the package visibility setting.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - uses: sigstore/cosign-installer@v3

      - name: Pull the published image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker pull "$IMAGE:$VERSION"
          cid=$(docker create "$IMAGE:$VERSION")
          docker cp "$cid:/gitops-server" /tmp/gitops-server
          docker rm "$cid" > /dev/null

      - name: The binary reports the release version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if ! strings /tmp/gitops-server | grep -qx "$VERSION"; then
            echo "the binary does not carry $VERSION; version-like strings found:"
            strings /tmp/gitops-server | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sort -u | head
            exit 1
          fi
          echo "binary reports $VERSION"

      - name: The chart metadata matches the tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          metadata=$(helm show chart "oci://$CHART" --version "${VERSION#v}")
          echo "$metadata"
          echo "$metadata" | grep -qx "version: ${VERSION#v}"
          # helm prints Chart.yaml as written, but tolerate the quotes being
          # dropped by a future metadata serialisation.
          echo "$metadata" | grep -Eq "^appVersion: \"?${VERSION}\"?$"

      - name: Latest points at this release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "$VERSION is a prerelease, :latest is left alone"
            exit 0
          fi
          tagged=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          latest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')
          [ "$tagged" = "$latest" ] || {
            echo ":latest ($latest) is not $VERSION ($tagged)"
            exit 1
          }

      - name: Both signatures verify against this workflow
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for ref in "$IMAGE:$VERSION" "$CHART:${VERSION#v}"; do
            cosign verify "$ref" \
              --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              > /dev/null
            echo "verified $ref"
          done

  # Created last, on purpose: a release page should never exist for a version
  # whose image failed to build. Re-running a tag build (or a rebuild dispatch)
  # finds the release and republishes it instead of failing.
  release:
    name: GitHub release
    needs: [verify-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or republish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "release $VERSION already exists, making sure it is published"
            # Deleting a tag re-drafts its release, which is why a rebuild has to
            # do this rather than assume the page is live.
            gh release edit "$VERSION" --draft=false
          else
            # --verify-tag keeps gh from creating the tag through the API, which
            # would not trigger any workflow.
            gh release create "$VERSION" --generate-notes --title "$VERSION" --verify-tag
          fi
