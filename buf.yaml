version: v2
# The agent workflow materialises source copies under .agentic/, which contain
# duplicates of api/core/*.proto and make buf fail with "symbol already defined".
modules:
  - path: .
    name: buf.build/weaveworks/wego
    excludes:
      - .agentic
deps:
  - buf.build/googleapis/googleapis
  - buf.build/grpc-ecosystem/grpc-gateway
lint:
  use:
    - STANDARD
  except:
    - ENUM_VALUE_PREFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_ZERO_VALUE_SUFFIX
    - FIELD_LOWER_SNAKE_CASE
    # allow the proto file to be in a non-package directory structure.
    - PACKAGE_DIRECTORY_MATCH
    - SERVICE_SUFFIX
